name: Actualizar conciertos desde Bandsintown

on:
  schedule:
    - cron: "17 5,17 * * *"   # dos veces al dia (07:17 y 19:17 en Espana)
  workflow_dispatch:           # boton "Run workflow" para actualizar al momento
  push:
    branches: [main]
    paths:
      - "events-overrides.json"
      - "scripts/fetch-events.mjs"
      - ".github/workflows/eventos.yml"

permissions:
  contents: write

concurrency:
  group: eventos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Descargar conciertos
        env:
          BIT_APP_ID: ${{ secrets.BANDSINTOWN_APP_ID }}
        # A quien preguntamos va en scripts/fetch-events.mjs (id_15661145).
        # Por id y no por nombre: hay otro grupo llamado Besta.
        run: node scripts/fetch-events.mjs

      # Si la API falla, el paso anterior corta el workflow y events.json
      # se queda como estaba: la web sigue enseñando los ultimos conciertos buenos.
      - name: Publicar si hay cambios
        run: |
          if git diff --quiet -- events.json; then
            echo "Sin cambios en los conciertos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          git commit -m "Conciertos actualizados desde Bandsintown"
          git push
