<style>
:root {
  --bg: #050508;
  --bg-2: #0d0b11;
  --fg: #f5f7ff;
  --muted: rgba(245, 247, 255, 0.6);
  --accent: #db7f4e;
  --accent-rgb: 219, 127, 78;
  --gold: #f4d35e;

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: 'Space Grotesk', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
img { display: block; }

/* ============ FONDO ============ */
.bg-stack { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #000; }
.bg-photo {
  position: absolute; inset: -8%;
  background-image: url('assets/images/no-me-sale-olvidarte/cover.jpg');
  background-size: cover; background-position: center;
  filter: blur(48px) saturate(1.15) brightness(0.55);
  transform: scale(1.15);
  opacity: 0;
  transition: opacity 1s ease;
}
.bg-photo.loaded { opacity: 0.9; }
.bg-fallback {
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at 28% 22%, rgba(var(--accent-rgb), 0.35), transparent 55%),
    radial-gradient(circle at 78% 78%, rgba(var(--gold-rgb), 0.18), transparent 55%),
    linear-gradient(180deg, #12100c 0%, #0a0810 45%, #050508 100%);
}
.bg-tint {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0.5) 68%, rgba(0,0,0,0.85) 100%),
    linear-gradient(180deg, rgba(5,5,8,0.35) 0%, rgba(5,5,8,0) 30%, rgba(5,5,8,0.55) 100%);
}
.grain { position: fixed; inset: 0; z-index: 4; pointer-events: none; mix-blend-mode: soft-light; opacity: 0.26; }
.scanlines {
  position: fixed; inset: 0; z-index: 4; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,0.10) 0px, rgba(0,0,0,0.10) 1px, transparent 1px, transparent 3px);
  mix-blend-mode: multiply; opacity: 0.18;
}

/* ============ ESTRUCTURA ============ */
.page {
  position: relative; z-index: 10;
  min-height: 100dvh;
  display: flex; flex-direction: column; align-items: center;
  padding: 22px 20px 40px;
}
.topbar {
  width: 100%; max-width: 460px;
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 26px;
}
.brand { display: inline-flex; align-items: center; gap: 10px; }
.brand img { height: 22px; width: auto; }
.spacer { flex: 1; }
.back-link {
  font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--muted);
  padding: 7px 13px; border: 1px solid rgba(255,255,255,0.14); border-radius: 999px;
  transition: border-color 0.2s, color 0.2s;
}
.back-link:hover { color: var(--accent); border-color: var(--accent); }

.card {
  width: 100%; max-width: 460px;
  display: flex; flex-direction: column; align-items: center;
  text-align: center; gap: 20px;
}

/* Badge estado */
.status {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 600; letter-spacing: 0.26em; text-transform: uppercase;
  color: var(--gold);
  padding: 6px 14px;
  border: 1px solid rgba(var(--gold-rgb), 0.4); border-radius: 999px;
  background: rgba(var(--gold-rgb), 0.06);
}
.status::before {
  content: ""; width: 7px; height: 7px; border-radius: 50%;
  background: var(--gold); box-shadow: 0 0 12px var(--gold);
  animation: blink 1.6s ease-in-out infinite;
}
.status.live { color: #58e08a; border-color: rgba(88,224,138,0.45); background: rgba(88,224,138,0.08); }
.status.live::before { background: #58e08a; box-shadow: 0 0 12px #58e08a; }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

/* Cover */
.cover {
  position: relative;
  width: min(72vw, 300px); aspect-ratio: 1/1;
  border-radius: 16px; overflow: hidden;
  box-shadow: 0 26px 70px rgba(0,0,0,0.7), 0 0 60px rgba(var(--accent-rgb), 0.22), inset 0 0 0 1px rgba(255,255,255,0.08);
  background: #0d0b11;
}
.cover-img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; opacity: 0; transition: opacity 0.6s ease;
}
.cover-img.loaded { opacity: 1; }
.cover-fallback {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px;
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,0.04) 0 8px, transparent 8px 16px),
    linear-gradient(135deg, rgba(var(--accent-rgb),0.5), rgba(var(--gold-rgb),0.25));
  font-family: 'Major Mono Display', monospace;
  font-size: 15px; letter-spacing: 0.06em; color: rgba(255,255,255,0.85); line-height: 1.5;
}

/* Título */
.titles { display: grid; gap: 4px; }
.song {
  margin: 0; font-size: clamp(24px, 6.4vw, 32px); font-weight: 700; letter-spacing: -0.01em;
  text-shadow: 0 2px 20px rgba(0,0,0,0.5);
}
.artist {
  margin: 0; font-family: 'JetBrains Mono', monospace;
  font-size: 12px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--muted);
}

/* Countdown */
.countdown-wrap { display: grid; gap: 10px; width: 100%; }
.countdown-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted);
}
.countdown { display: flex; justify-content: center; gap: 8px; }
.cd-cell {
  min-width: 62px; padding: 12px 8px 10px;
  background: rgba(13,11,17,0.55);
  border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
  backdrop-filter: blur(8px);
}
.cd-num {
  font-family: 'JetBrains Mono', monospace; font-weight: 700;
  font-size: clamp(22px, 6vw, 28px); line-height: 1; color: var(--fg);

.cd-unit {

  font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted);

.plink {
  display: flex; align-items: center; gap: 14px;

  background: rgba(245,247,255,0.05);

.plink:hover { transform: translateY(-1px); border-color: rgba(var(--accent-rgb),0.6); background: rgba(var(--accent-rgb),0.08); }
.plink .ico { width: 26px; height: 26px; flex: 0 0 26px; display: grid; place-items: center; }
.plink .ico svg { width: 100%; height: 100%; }
.plink .name { flex: 1; text-align: left; font-weight: 600; font-size: 15px; }
.plink .act {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--accent);
  padding: 5px 11px; border: 1px solid rgba(var(--accent-rgb),0.4); border-radius: 999px;
  white-space: nowrap; transition: background 0.2s, color 0.2s;
}
.plink:hover .act { background: var(--accent); color: #1a1009; }
.plink.soon { opacity: 0.5; pointer-events: none; }
.plink.soon .act { color: var(--muted); border-color: rgba(255,255,255,0.18); }

/* Compartir + foot */
.share {
  margin-top: 4px;
  display: inline-flex; align-items: center; gap: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
  background: transparent; border: 1px solid rgba(255,255,255,0.14); border-radius: 999px;
  padding: 9px 18px; transition: border-color 0.2s, color 0.2s;
}
.share:hover { color: var(--accent); border-color: var(--accent); }
.foot {
  margin-top: 18px; font-size: 11px; color: var(--muted); letter-spacing: 0.04em; text-align: center;
}

@media (max-width: 420px) {
  .cd-cell { min-width: 54px; padding: 10px 6px 8px; }
  .plink .name { font-size: 14px; }
}
</style>
</head>

function iconFor(key){ return ICONS[key] || '<svg viewBox="0 0 24 24" fill="#db7f4e"><path d="M12 3v10.55A4 4 0 1014 17V7h4V3h-6z"/></svg>'; }

/* =========================== Render de enlaces =========================== */
const released = () => Date.now() >= RELEASE.getTime();
const linksEl = document.getElementById('links');

function renderLinks() {
  const live = released();
  linksEl.innerHTML = '';
  PLATFORMS.forEach(p => {
    const url = live ? (p.listen || p.presave) : p.presave;
    const soon = !url;
    const label = live ? 'Escuchar' : 'Pre-save';
    const a = document.createElement(soon ? 'div' : 'a');
    a.className = 'plink' + (soon ? ' soon' : '');
    if (!soon) { a.href = url; a.target = '_blank'; a.rel = 'noopener'; }
    a.innerHTML =
      '<span class="ico">' + iconFor(p.key) + '</span>' +
      '<span class="name">' + p.name + '</span>' +
      '<span class="act">' + (soon ? 'Próximamente' : label) + '</span>';
    linksEl.appendChild(a);
  });
}

/* =========================== Countdown =========================== */
const cd = {
  wrap: document.getElementById('countdown-wrap'),
  caption: document.getElementById('cd-caption'),
  d: document.getElementById('cd-d'),
  h: document.getElementById('cd-h'),
  m: document.getElementById('cd-m'),
  s: document.getElementById('cd-s'),
};
let wasReleased = released();

function pad(n){ return String(n).padStart(2, '0'); }

function tick() {
  const diff = RELEASE.getTime() - Date.now();
  if (diff <= 0) {
    if (!wasReleased) { wasReleased = true; renderLinks(); }
    cd.caption.textContent = 'Ya disponible en todas las plataformas';
    cd.d.textContent = cd.h.textContent = cd.m.textContent = cd.s.textContent = '00';
    document.getElementById('countdown').style.display = 'none';
    return;
  }
  const s = Math.floor(diff / 1000);
  cd.d.textContent = pad(Math.floor(s / 86400));
  cd.h.textContent = pad(Math.floor((s % 86400) / 3600));
  cd.m.textContent = pad(Math.floor((s % 3600) / 60));
  cd.s.textContent = pad(s % 60);
}

/* =========================== Compartir =========================== */
const shareBtn = document.getElementById('share');
shareBtn.addEventListener('click', async () => {
  const shareData = {
    title: 'BESTA — No me sale olvidarte',
    text: '«No me sale olvidarte», nuevo single de BESTA. Escúchalo ya 👇',
    url: location.href,
  };
  try {
    if (navigator.share) { await navigator.share(shareData); }
    else {
      await navigator.clipboard.writeText(location.href);
      shareBtn.textContent = '¡Enlace copiado!';
      setTimeout(() => { shareBtn.textContent = 'Compartir'; }, 1800);
    }
  } catch (_) {}
});

/* =========================== Fondo / carátula =========================== */
(function loadCover(){
  const img = document.getElementById('cover-img');
  const bg = document.getElementById('bg-photo');
  const probe = new Image();
  probe.onload = () => { img.classList.add('loaded'); bg.classList.add('loaded'); };
  probe.onerror = () => {}; // se queda el fallback (degradado + texto)
  probe.src = 'assets/images/no-me-sale-olvidarte/cover.jpg';
})();

/* =========================== Grain =========================== */
const grain = document.getElementById('grain');
const gctx = grain.getContext('2d');
function resizeGrain(){ grain.width = window.innerWidth; grain.height = window.innerHeight; }
window.addEventListener('resize', resizeGrain); resizeGrain();
function drawGrain(){
  const w = grain.width, h = grain.height;
  const im = gctx.createImageData(w, h), d = im.data;
  for (let i = 0; i < d.length; i += 4){ const v = Math.random()*255; d[i]=d[i+1]=d[i+2]=v; d[i+3]=Math.random()*55; }
  gctx.putImageData(im, 0, 0);
}
let last = 0;
function loop(t){ if (t - last > 70){ drawGrain(); last = t; } requestAnimationFrame(loop); }
requestAnimationFrame(loop);

/* =========================== Init =========================== */
renderLinks();
tick();
setInterval(tick, 1000);
</script>
