<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
<meta name="theme-color" content="#050508" />
<title>BESTA — merch</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/suite/suite-shell.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="/suite/suite.js"></script>
<style>
body { visibility: hidden; }
body.ready { visibility: visible; }

/* ---------- resumen ---------- */
.stats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 26px; }
.stat { background: var(--bg-2); border: 1px solid var(--line); border-radius: 13px; padding: 14px 16px; }
.stat .k { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.stat .v { font-size: 24px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 3px; }
.stat.accent .v { color: var(--accent); }

/* ---------- pestañas ---------- */
.tabs { display: flex; gap: 5px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
.tab {
  background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 14px;
  color: var(--muted); font-weight: 600; font-size: 14px; margin-bottom: -1px;
}
.tab.on { color: var(--fg); border-bottom-color: var(--accent); }
.tab .n { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-left: 5px; }

.bar { display: flex; gap: 9px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
.bar input[type=search] { flex: 1; min-width: 160px; }
.bar select { width: auto; min-width: 130px; }

/* ---------- productos ---------- */
.prods { display: grid; gap: 11px; }
.prod {
  display: grid; gap: 12px; align-items: center; padding: 14px 16px;
  grid-template-columns: 1fr auto auto; background: var(--bg-2);
  border: 1px solid var(--line); border-radius: 13px;
}
.prod.out { border-color: rgba(255,107,107,.32); }
.prod.arch { opacity: .5; }
.prod-id { min-width: 0; }
.prod-id b { font-size: 16px; font-weight: 700; }
.prod-id .var {
  font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  background: rgba(255,255,255,.07); color: var(--muted); padding: 2px 7px; border-radius: 5px; margin-left: 7px;
}
.prod-id .info { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
.prod-nums { display: flex; gap: 18px; text-align: right; font-variant-numeric: tabular-nums; }
.prod-nums .n { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.prod-nums .v { font-size: 17px; font-weight: 700; }
.prod-nums .v.zero { color: var(--bad); }
.prod-nums .v.held { color: var(--warn); }
.prod-acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; cursor: default; }
.prod-acts button { padding: 6px 11px; font-size: 12px; border-radius: 8px; width: auto; }

/* La tarjeta entera abre el historial, menos la zona de botones. */
.prod { cursor: pointer; }
.prod-id .caret {
  display: inline-block; margin-left: 8px; font-size: 11px;
  color: var(--muted); transition: transform .15s;
}
.prod-wrap.open .prod-id .caret { transform: rotate(90deg); }
.prod-wrap.open .prod {
  border-bottom-color: transparent;
  border-bottom-left-radius: 0; border-bottom-right-radius: 0;
}
.prod-hist {
  display: grid; gap: 7px; padding: 12px 14px 14px;
  background: var(--bg-2); border: 1px solid var(--line); border-top: 0;
  border-radius: 0 0 13px 13px;
}
.prod-hist .mov { background: var(--bg-3); }
.prod-hist .empty { padding: 12px 0; font-size: 13px; }
.hist { display: grid; gap: 7px; }

/* ---------- desglose por talla ---------- */
.sizes { display: grid; gap: 6px; }
.size {
  display: grid; gap: 10px; align-items: center; grid-template-columns: 58px 1fr auto;
  padding: 9px 12px; background: var(--bg-3);
  border: 1px solid var(--line); border-radius: 9px;
}
.size.out { border-color: rgba(255,107,107,.28); }
.size > b {
  font-family: var(--mono); font-size: 13px; letter-spacing: .06em; text-transform: uppercase;
}
.size-nums {
  display: flex; gap: 14px; flex-wrap: wrap;
  font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums;
}
.size-nums .zero { color: var(--bad); }
.size-nums .held { color: var(--warn); }
.size-acts { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
.size-acts button { padding: 4px 9px; font-size: 11px; border-radius: 7px; width: auto; }
@media (max-width: 720px) {
  .size { grid-template-columns: 1fr; }
  .size-acts { justify-content: flex-start; }
}

/* ---------- editor de tallas (dentro del modal) ---------- */
.chk { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin: 2px 0 14px; }
.chk input { width: auto; }
.szrow { display: grid; grid-template-columns: 1fr 92px auto; gap: 7px; margin-bottom: 7px; align-items: center; }
.szrow.new { grid-template-columns: 1fr 92px 74px auto; }
.szrow input { margin: 0; }
.szrow .szdel {
  width: 30px; height: 30px; padding: 0; border-radius: 8px; background: none;
  border: 1px solid var(--line-strong); color: var(--muted); font-size: 15px; line-height: 1;
}
.sz-add { width: auto; padding: 6px 12px; font-size: 12px; border-radius: 8px; }
.sz-hint { font-size: 12px; color: var(--muted); margin: 9px 0 0; }
.field span i { font-style: normal; text-transform: none; letter-spacing: 0; opacity: .7; }
@media (max-width: 720px) {
  .prod { grid-template-columns: 1fr; }
  .prod-nums { justify-content: flex-start; text-align: left; }
  .prod-acts { justify-content: flex-start; }
}

/* ---------- movimientos ---------- */
.movs { display: grid; gap: 8px; }
.mov {
  display: grid; gap: 12px; align-items: center; padding: 11px 15px;
  grid-template-columns: 84px 1fr auto auto; background: var(--bg-2);
  border: 1px solid var(--line); border-radius: 11px; font-size: 14px;
}
.mov.open { border-color: rgba(244,211,94,.35); }
.mov .kind {
  font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  padding: 3px 0; border-radius: 5px; text-align: center;
}
.kind.sale    { background: rgba(95,214,165,.14); color: var(--ok); }
.kind.restock { background: rgba(107,169,255,.14); color: #6ba9ff; }
.kind.reserve { background: rgba(244,211,94,.14); color: var(--warn); }
.kind.gift    { background: rgba(177,139,255,.14); color: #b18bff; }
.kind.adjust  { background: rgba(255,255,255,.07); color: var(--muted); }
.mov .what { min-width: 0; }
.mov .what b { font-weight: 600; }
.mov .what span { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.mov .amount { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; white-space: nowrap; }
.mov .amount small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); }
.mov .acts { display: flex; gap: 6px; }
.mov .acts button { padding: 5px 10px; font-size: 11px; border-radius: 7px; width: auto; }
@media (max-width: 720px) {
  .mov { grid-template-columns: 84px 1fr; }
  .mov .amount, .mov .acts { grid-column: 2; text-align: left; }
}

.empty { padding: 46px 20px; text-align: center; color: var(--muted); }
.err {
  padding: 14px 16px; border-radius: 11px; margin-bottom: 18px;
  background: rgba(255,107,107,.1); border: 1px solid rgba(255,107,107,.3); color: #ffb3b3; font-size: 14px;
}
.err code { font-family: var(--mono); font-size: 12px; }
.err .relogin {
  font: inherit; color: inherit; cursor: pointer; padding: 0;
  background: none; border: 0; border-bottom: 1px solid currentColor;
}

/* ---------- menú «···» ---------- */
.pop { position: fixed; inset: 0; z-index: 2400; }
.pop-menu {
  position: absolute; min-width: 190px; padding: 5px;
  background: var(--bg-3); border: 1px solid var(--line-strong);
  border-radius: 11px; box-shadow: 0 16px 40px rgba(0,0,0,.6);
}
.pop-menu button {
  display: block; width: 100%; text-align: left; background: none; border: 0;
  padding: 8px 11px; border-radius: 7px; font-size: 13px; color: var(--fg);
}
.pop-menu button:hover { background: rgba(255,255,255,.07); }
.pop-menu button.danger { color: var(--bad); }
.pop-menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 3px; }

/* ---------- modal ---------- */
.modal { position: fixed; inset: 0; z-index: 2500; display: grid; place-items: center; padding: 20px;
  background: rgba(0,0,0,.65); backdrop-filter: blur(3px); overflow: auto; }
.modal-card {
  width: min(430px, 100%); background: var(--bg-2); border: 1px solid var(--line);
  border-radius: 16px; padding: 22px;
}
.modal-card h2 { margin: 0 0 4px; font-size: 20px; }
.modal-card .lead { margin: 0 0 18px; font-size: 13px; color: var(--muted); }
.row2 { display: grid; gap: 11px; grid-template-columns: 1fr 1fr; }
.modal-acts { display: flex; gap: 9px; margin-top: 18px; }
.modal-acts .btn-primary, .modal-acts .btn-ghost { width: auto; flex: 1; }
</style>
</head>
<body>

<header class="space-head">
  <div class="who">
    <img src="/assets/images/besta_color.png" alt="BESTA">
    <b>merch</b><i>suite</i>
  </div>
  <div class="tools">
    <button class="btn-ghost sm" id="new-product">+ producto</button>
    <a class="btn-ghost sm" href="/suite/" style="text-decoration:none">suite</a>
  </div>
</header>

<main class="wrap">
  <div id="error" class="err" hidden></div>

  <section class="stats" id="stats"></section>

  <nav class="tabs">
    <button class="tab on" data-tab="products">productos <span class="n" id="n-products"></span></button>
    <button class="tab" data-tab="movements">movimientos <span class="n" id="n-movements"></span></button>
  </nav>

  <div id="view-products">
    <div class="bar">
      <input type="search" id="q" placeholder="buscar producto…">
      <label style="display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;white-space:nowrap">
        <input type="checkbox" id="show-archived" style="width:auto"> ver archivados
      </label>
    </div>
    <div class="prods" id="prods"></div>
  </div>

  <div id="view-movements" hidden>
    <div class="bar">
      <select id="filter-kind">
        <option value="">todos los tipos</option>
        <option value="sale">ventas</option>
        <option value="reserve">reservas</option>
        <option value="restock">reposiciones</option>
        <option value="gift">regalos</option>
        <option value="adjust">recuentos</option>
      </select>
      <select id="filter-status">
        <option value="">cualquier estado</option>
        <option value="open">reservas abiertas</option>
        <option value="done">cerrados</option>
        <option value="cancelled">cancelados</option>
      </select>
    </div>
    <div class="movs" id="movs"></div>
  </div>
</main>

<div id="modal-root"></div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  let supa = null;
  let products = [];
  let variants = [];
  let movements = [];
  let tab = "products";
  let openProduct = null;          // qué producto tiene el panel desplegado

  const KIND_LABEL = {
    sale: "venta", restock: "repone", reserve: "reserva", gift: "regalo", adjust: "recuento"
  };

  const eur = n => (Number(n) || 0).toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function showError(msg) {
    const box = $("error");
    if (!msg) { box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = msg;
  }

  /* --------------------------------------------------------
     Productos y tallas.
     El stock vive en la talla, no en el producto: una camiseta es
     UN producto con cuatro filas. Lo que no tiene tallas lleva una
     sola fila con la etiqueta vacía y aquí no se nota.
     -------------------------------------------------------- */
  const productById = id => products.find(p => p.id === id);
  const variantById = id => variants.find(v => v.id === id);

  // Las archivadas siguen en `variants` porque su historial cuenta,
  // pero no se venden ni suman stock.
  const sizesOf = p => variants
    .filter(v => v.product_id === p.id && !v.archived)
    .sort((a, b) => a.position - b.position || a.label.localeCompare(b.label));

  // Un producto "sin tallas" es el que solo tiene la fila sin etiqueta.
  const hasSizes = p => { const vs = sizesOf(p); return vs.length > 1 || (vs.length === 1 && !!vs[0].label); };

  // La talla puede llevar precio propio (la XXL suele costar más); si no, el del producto.
  const priceOf = v => v.price ?? productById(v.product_id)?.price ?? 0;

  /* Unidades apartadas por reservas todavía abiertas. Están en la caja pero
     ya tienen dueño, así que no se pueden vender dos veces. */
  function heldFor(variantId) {
    return movements
      .filter(m => m.variant_id === variantId && m.kind === "reserve" && m.status === "open")
      .reduce((sum, m) => sum + m.qty, 0);
  }
  const freeOf = v => v.stock - heldFor(v.id);

  const totals = p => sizesOf(p).reduce((t, v) => {
    t.stock += v.stock; t.held += heldFor(v.id); t.free += freeOf(v); return t;
  }, { stock: 0, held: 0, free: 0 });

  function variantName(v) {
    const p = v && productById(v.product_id);
    if (!p) return "producto borrado";
    return p.name + (v.label ? " · " + v.label : "");
  }

  /* ---------------- carga ---------------- */
  async function load() {
    showError("");
    const [pr, va, mv] = await Promise.all([
      supa.from("merch_products").select("*").order("name", { ascending: true }),
      supa.from("merch_variants").select("*").order("position", { ascending: true }),
      supa.from("merch_movements").select("*").order("created_at", { ascending: false }).limit(500)
    ]);
    const bad = pr.error || va.error || mv.error;
    if (bad) {
      // PostgREST no ve la tabla de dos maneras: 42P01 viene de Postgres y
      // PGRST205 de su caché de esquema. Las dos significan lo mismo aquí.
      if (bad.code === "42P01" || bad.code === "PGRST205" || /does not exist|schema cache/i.test(bad.message)) {
        showError("Faltan migraciones de merch por aplicar. Lanza <code>supabase db push</code> y recarga.");
      } else if (/jwt|token/i.test(bad.message)) {
        // Token rechazado por desfase de reloj o sesión caducada: el que hay
        // guardado ya no sirve, hay que pedir uno nuevo entrando otra vez.
        showError("La sesión guardada ya no vale (<code>" + esc(bad.message) + "</code>). " +
          "Comprueba que la fecha y hora del equipo sean automáticas y " +
          "<button type=\"button\" class=\"relogin\" onclick=\"BestaSuite.logout()\">vuelve a entrar</button>.");
      } else {
        showError("Error cargando: <code>" + esc(bad.message) + "</code>");
      }
      products = []; variants = []; movements = [];
    } else {
      products = pr.data || [];
      variants = va.data || [];
      movements = mv.data || [];
    }
    render();
  }

  /* ---------------- pintado ---------------- */
  function renderStats() {
    const live = products.filter(p => !p.archived);
    const units = live.reduce((s, p) => s + totals(p).stock, 0);
    const value = live.reduce((s, p) => s + sizesOf(p).reduce((a, v) => a + v.stock * priceOf(v), 0), 0);
    const held = movements.filter(m => m.kind === "reserve" && m.status === "open").reduce((s, m) => s + m.qty, 0);
    const revenue = movements.filter(m => m.kind === "sale").reduce((s, m) => s + m.qty * Number(m.unit_price), 0);
    $("stats").innerHTML = `
      <div class="stat"><div class="k">en stock</div><div class="v">${units}<small>uds</small></div></div>
      <div class="stat"><div class="k">valor del stock</div><div class="v">${eur(value)}</div></div>
      <div class="stat"><div class="k">reservado</div><div class="v">${held}<small>uds</small></div></div>
      <div class="stat accent"><div class="k">vendido</div><div class="v">${eur(revenue)}</div></div>`;
  }

  function renderProducts() {
    const q = $("q").value.trim().toLowerCase();
    const showArchived = $("show-archived").checked;
    const list = products.filter(p => {
      if (!showArchived && p.archived) return false;
      if (!q) return true;
      const hay = p.name + " " + p.info + " " + sizesOf(p).map(v => v.label).join(" ");
      return hay.toLowerCase().includes(q);
    });

    $("n-products").textContent = products.filter(p => !p.archived).length || "";
    const box = $("prods");
    if (!list.length) {
      box.innerHTML = `<div class="empty">${products.length ? "Nada coincide con la búsqueda." : "Todavía no hay productos. Empieza con « + producto »."}</div>`;
      return;
    }
    box.innerHTML = list.map(p => {
      const vs = sizesOf(p);
      const { stock, held, free } = totals(p);
      const sized = hasSizes(p);
      const open = openProduct === p.id;
      // Con precios distintos por talla, un número solo mentiría.
      const prices = [...new Set(vs.map(priceOf))];
      const price = prices.length > 1 ? "desde " + eur(Math.min(...prices)) : eur(prices.length ? prices[0] : p.price);
      return `<div class="prod-wrap ${open ? "open" : ""}">
        <div class="prod ${free <= 0 ? "out" : ""} ${p.archived ? "arch" : ""}" data-prod="${p.id}">
          <div class="prod-id">
            <b>${esc(p.name)}</b>
            ${sized ? `<span class="var">${vs.length} tallas</span>` : ""}
            <span class="caret">›</span>
            ${p.info ? `<span class="info">${esc(p.info)}</span>` : ""}
          </div>
          <div class="prod-nums">
            <div><div class="n">precio</div><div class="v">${price}</div></div>
            <div><div class="n">stock</div><div class="v ${stock <= 0 ? "zero" : ""}">${stock}</div></div>
            ${held ? `<div><div class="n">apartado</div><div class="v held">${held}</div></div>` : ""}
            <div><div class="n">libre</div><div class="v ${free <= 0 ? "zero" : ""}">${free}</div></div>
          </div>
          <div class="prod-acts">
            <button class="btn-ghost" data-act="sale"    data-id="${p.id}" ${free <= 0 ? "disabled" : ""}>vender</button>
            <button class="btn-ghost" data-act="reserve" data-id="${p.id}" ${free <= 0 ? "disabled" : ""}>reservar</button>
            <button class="btn-ghost" data-act="restock" data-id="${p.id}">+ stock</button>
            <button class="btn-ghost" data-act="more"    data-id="${p.id}">···</button>
          </div>
        </div>
        ${open ? renderPanel(p) : ""}
      </div>`;
    }).join("");
  }

  /* Lo que se despliega al clicar la tarjeta: el desglose por talla, si las
     tiene, y todo lo que le ha pasado al producto. Aquí y no en un modal
     porque de un vistazo quieres ver varios productos abiertos a la vez. */
  function renderPanel(p) {
    const sized = hasSizes(p);
    const sizes = !sized ? "" : `<div class="sizes">${sizesOf(p).map(v => {
      const held = heldFor(v.id), free = freeOf(v);
      return `<div class="size ${free <= 0 ? "out" : ""}">
        <b>${esc(v.label)}</b>
        <div class="size-nums">
          <span>${eur(priceOf(v))}</span>
          <span class="${v.stock <= 0 ? "zero" : ""}">${v.stock} en caja</span>
          ${held ? `<span class="held">${held} apartadas</span>` : ""}
          <span class="${free <= 0 ? "zero" : ""}">${free} libres</span>
        </div>
        <div class="size-acts">
          <button class="btn-ghost" data-vact="sale"    data-id="${v.id}" ${free <= 0 ? "disabled" : ""}>vender</button>
          <button class="btn-ghost" data-vact="reserve" data-id="${v.id}" ${free <= 0 ? "disabled" : ""}>reservar</button>
          <button class="btn-ghost" data-vact="restock" data-id="${v.id}">+ stock</button>
        </div>
      </div>`;
    }).join("")}</div>`;

    // Incluye las tallas archivadas: lo que se vendió, se vendió.
    const mine = variants.filter(v => v.product_id === p.id).map(v => v.id);
    const rows = movements.filter(m => mine.includes(m.variant_id));
    const hist = rows.length
      ? `<div class="hist">${rows.map(m => movRow(m, sized ? "label" : "none")).join("")}</div>`
      : `<div class="empty">Todavía no le ha pasado nada a este producto.</div>`;

    return `<div class="prod-hist">${sizes}${hist}</div>`;
  }

  /* Una fila de movimiento. La misma en la pestaña de movimientos y en el
     historial del producto; allí sobra repetir el nombre, que ya está arriba. */
  function movRow(m, naming) {
    const v = variantById(m.variant_id);
    const who = naming === "full" ? variantName(v) : naming === "label" ? (v?.label || "") : "";
    const isOpen = m.kind === "reserve" && m.status === "open";
    const when = new Date(m.created_at).toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "2-digit" });
    const meta = [when, m.customer, m.event, m.note, m.status === "cancelled" ? "cancelado" : ""]
      .filter(Boolean).map(esc).join(" · ");
    const money = (m.kind === "sale" || (m.kind === "reserve" && m.status !== "cancelled"))
      ? eur(m.qty * Number(m.unit_price)) : "—";
    return `<div class="mov ${isOpen ? "open" : ""}">
      <div class="kind ${m.kind}">${KIND_LABEL[m.kind]}</div>
      <div class="what"><b>${m.qty}×${who ? " " + esc(who) : ""}</b><span>${meta}</span></div>
      <div class="amount">${money}${m.kind === "adjust" ? "<small>stock fijado</small>" : ""}</div>
      <div class="acts">${isOpen
        ? `<button class="btn-ghost" data-mov="deliver" data-id="${m.id}">entregar</button>
           <button class="btn-ghost btn-danger" data-mov="cancel" data-id="${m.id}">anular</button>`
        : `<button class="btn-ghost btn-danger" data-mov="delete" data-id="${m.id}">borrar</button>`}</div>
    </div>`;
  }

  function renderMovements() {
    const k = $("filter-kind").value, st = $("filter-status").value;
    const list = movements.filter(m => (!k || m.kind === k) && (!st || m.status === st));
    const open = movements.filter(m => m.kind === "reserve" && m.status === "open").length;
    $("n-movements").textContent = open ? open + " abiertas" : "";

    const box = $("movs");
    if (!list.length) { box.innerHTML = `<div class="empty">Sin movimientos que enseñar.</div>`; return; }
    box.innerHTML = list.map(m => movRow(m, "full")).join("");
  }

  function render() {
    renderStats();
    if (tab === "products") renderProducts(); else renderMovements();
  }

  /* ---------------- modales ---------------- */
  function closeModal() { $("modal-root").innerHTML = ""; }

  function openModal(html, onSubmit) {
    $("modal-root").innerHTML = `<div class="modal"><form class="modal-card">${html}</form></div>`;
    const modal = $("modal-root").querySelector(".modal");
    const form = modal.querySelector("form");
    modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
    modal.querySelector("[data-cancel]").addEventListener("click", closeModal);
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const btn = form.querySelector("[type=submit]");
      btn.disabled = true;
      try {
        await onSubmit(new FormData(form));
        closeModal();
        await load();
      } catch (err) {
        alert(err.message || String(err));
        btn.disabled = false;
      }
    });
    form.querySelector("input, select, textarea")?.focus();
    return form;
  }

  /* Una fila del editor de tallas. Las que ya existen no llevan stock:
     ese se mueve con movimientos, no escribiéndolo a mano. */
  function sizeRowHTML(v) {
    const isNew = !v;
    return `<div class="szrow ${isNew ? "new" : ""}" data-vid="${v?.id || ""}">
      <input name="sz_label" value="${esc(v?.label || "")}" placeholder="talla (S, M, L…)" required>
      <input name="sz_price" type="number" step="0.01" min="0" value="${v?.price ?? ""}" placeholder="precio">
      ${isNew ? `<input name="sz_stock" type="number" min="0" value="0" placeholder="uds">` : ""}
      <button type="button" class="szdel" title="quitar esta talla">×</button>
    </div>`;
  }

  function productModal(p) {
    const edit = !!p;
    const sized = edit && hasSizes(p);
    const rows = edit ? sizesOf(p) : [];
    let form;

    form = openModal(`
      <h2>${edit ? "Editar producto" : "Producto nuevo"}</h2>
      <p class="lead">${edit ? "El stock se cambia con movimientos, no aquí." : "El stock inicial entra como una reposición."}</p>
      <label class="field"><span>nombre</span><input name="name" required value="${esc(p?.name || "")}" placeholder="Camiseta logo"></label>
      <div class="row2">
        <label class="field"><span>precio venta</span><input name="price" type="number" step="0.01" min="0" required value="${p?.price ?? ""}" placeholder="20"></label>
        <label class="field"><span>coste unidad</span><input name="cost" type="number" step="0.01" min="0" value="${p?.cost ?? 0}" placeholder="7"></label>
      </div>
      <label class="field"><span>información</span><textarea name="info" rows="2" placeholder="Algodón orgánico, serigrafía a dos tintas">${esc(p?.info || "")}</textarea></label>

      <label class="chk"><input type="checkbox" id="sz-on" ${sized ? "checked" : ""}> tiene tallas o variantes</label>
      <div id="sz-box" ${sized ? "" : "hidden"}>
        <div id="sz-rows">${(sized ? rows : []).map(sizeRowHTML).join("")}</div>
        <button type="button" class="btn-ghost sz-add">+ añadir talla</button>
        <p class="sz-hint">El precio de cada talla es opcional: en blanco cobra el del producto.</p>
      </div>
      ${edit ? "" : `<div id="sz-single"><label class="field"><span>stock inicial</span><input name="stock" type="number" min="0" value="0"></label></div>`}

      <div class="modal-acts">
        <button type="button" class="btn-ghost" data-cancel>cancelar</button>
        <button type="submit" class="btn-primary">${edit ? "guardar" : "crear"}</button>
      </div>`, async fd => {
      const payload = {
        name: String(fd.get("name")).trim(),
        price: Number(fd.get("price")) || 0,
        cost: Number(fd.get("cost")) || 0,
        info: String(fd.get("info") || "").trim()
      };

      let pid = p?.id;
      if (edit) {
        const { error } = await supa.from("merch_products").update(payload).eq("id", p.id);
        if (error) throw error;
      } else {
        const { data, error } = await supa.from("merch_products").insert(payload).select().single();
        if (error) throw error;
        pid = data.id;
      }

      const wantsSizes = form.querySelector("#sz-on").checked;
      const rowEls = wantsSizes ? [...form.querySelectorAll(".szrow")] : [];
      // Sin tallas el producto sigue necesitando una fila donde guardar el
      // stock: la que lleva la etiqueta vacía.
      const wanted = wantsSizes
        ? rowEls.map((row, i) => ({
            id: row.dataset.vid || null,
            label: row.querySelector("[name=sz_label]").value.trim(),
            price: row.querySelector("[name=sz_price]").value.trim() === ""
              ? null : Number(row.querySelector("[name=sz_price]").value),
            stock: Math.max(0, Number(row.querySelector("[name=sz_stock]")?.value) || 0),
            position: i
          }))
        : [{
            id: (edit ? sizesOf(p).find(v => !v.label)?.id : null) || null,
            label: "", price: null,
            stock: edit ? 0 : Math.max(0, Number(fd.get("stock")) || 0),
            position: 0
          }];

      if (wantsSizes && !wanted.length) throw new Error("Añade al menos una talla, o desmarca la casilla.");
      const labels = wanted.map(w => w.label);
      if (new Set(labels).size !== labels.length) throw new Error("Hay dos tallas con el mismo nombre.");

      const keep = [];
      for (const w of wanted) {
        if (w.id) {
          keep.push(w.id);
          const { error } = await supa.from("merch_variants")
            .update({ label: w.label, price: w.price, position: w.position, archived: false }).eq("id", w.id);
          if (error) throw error;
          continue;
        }
        // Si esa talla ya existió y se archivó, se revive: el índice único
        // (producto, etiqueta) no deja meter otra igual, y su historial vale.
        const old = variants.find(v => v.product_id === pid && v.label === w.label);
        if (old) {
          keep.push(old.id);
          const { error } = await supa.from("merch_variants")
            .update({ price: w.price, position: w.position, archived: false }).eq("id", old.id);
          if (error) throw error;
          continue;
        }
        const { data: nv, error } = await supa.from("merch_variants")
          .insert({ product_id: pid, label: w.label, price: w.price, position: w.position, stock: w.stock })
          .select().single();
        if (error) throw error;
        keep.push(nv.id);
        if (w.stock > 0) {
          await supa.from("merch_movements").insert({
            variant_id: nv.id, kind: "restock", qty: w.stock,
            unit_price: payload.cost, note: "stock inicial"
          });
        }
      }

      // Las que se quitan se archivan, no se borran: sus ventas ya están
      // contadas y borrarlas se llevaría el historial por delante.
      for (const v of (edit ? sizesOf(p) : [])) {
        if (keep.includes(v.id)) continue;
        const { error } = await supa.from("merch_variants").update({ archived: true }).eq("id", v.id);
        if (error) throw error;
      }
    });

    const chk = form.querySelector("#sz-on");
    const box = form.querySelector("#sz-box");
    const single = form.querySelector("#sz-single");
    const rowsBox = form.querySelector("#sz-rows");

    // Un input oculto y `required` bloquea el envío sin poder enfocarlo ni
    // explicar nada; deshabilitado se queda fuera de la validación.
    const syncSizeBox = () => {
      box.hidden = !chk.checked;
      box.querySelectorAll("input").forEach(i => { i.disabled = !chk.checked; });
      if (single) single.hidden = chk.checked;
    };
    chk.addEventListener("change", () => {
      // En los dos sentidos se archivan las filas de stock actuales.
      if (edit && chk.checked !== sized && totals(p).stock > 0 &&
          !confirm("Las filas de stock de ahora se archivan y el producto empieza a cero. Haz un recuento después.")) {
        chk.checked = sized; return;
      }
      if (chk.checked && !rowsBox.children.length) rowsBox.insertAdjacentHTML("beforeend", sizeRowHTML(null));
      syncSizeBox();
    });
    form.querySelector(".sz-add").addEventListener("click", () => {
      rowsBox.insertAdjacentHTML("beforeend", sizeRowHTML(null));
      rowsBox.lastElementChild.querySelector("input").focus();
    });
    rowsBox.addEventListener("click", e => {
      if (e.target.closest(".szdel")) e.target.closest(".szrow").remove();
    });
    syncSizeBox();
  }

  /* Un solo modal para vender, reservar, reponer y regalar: cambia el copy
     y qué le hace al stock, el formulario es el mismo. Si el producto tiene
     tallas y no venimos de una en concreto, se elige aquí. */
  function movementModal(p, kind, only) {
    const all = sizesOf(p);
    const list = only ? [only] : (kind === "restock" ? all : all.filter(v => freeOf(v) > 0));
    if (!list.length) { alert("No queda nada libre de este producto."); return; }
    const first = list[0];
    const titles = { sale: "Vender", reserve: "Reservar", restock: "Reponer stock", gift: "Regalar" };
    const pricey = kind === "sale" || kind === "reserve";

    const form = openModal(`
      <h2>${titles[kind]}</h2>
      <p class="lead">${esc(p.name)}<span id="mv-free"></span></p>
      ${list.length > 1
        ? `<label class="field"><span>talla</span><select name="variant_id">${
            list.map(v => `<option value="${v.id}">${esc(v.label)} — ${freeOf(v)} libres</option>`).join("")
          }</select></label>`
        : `<input type="hidden" name="variant_id" value="${first.id}">`}
      <div class="row2">
        <label class="field"><span>unidades</span><input name="qty" type="number" min="1" value="1" required></label>
        ${pricey
          ? `<label class="field"><span>precio unidad</span><input name="unit_price" type="number" step="0.01" min="0"></label>`
          : kind === "restock"
            ? `<label class="field"><span>coste unidad</span><input name="unit_price" type="number" step="0.01" min="0" value="${p.cost}"></label>`
            : `<div></div>`}
      </div>
      ${kind === "sale" || kind === "reserve" || kind === "gift"
        ? `<label class="field"><span>${kind === "reserve" ? "para quién" : "cliente (opcional)"}</span><input name="customer" ${kind === "reserve" ? "required" : ""} placeholder="Nombre o @instagram"></label>`
        : ""}
      <div class="row2">
        <label class="field"><span>bolo / sitio</span><input name="event" placeholder="Sala X, 12 mar"></label>
        <label class="field"><span>nota</span><input name="note" placeholder="pagó bizum"></label>
      </div>
      <div class="modal-acts">
        <button type="button" class="btn-ghost" data-cancel>cancelar</button>
        <button type="submit" class="btn-primary">${titles[kind].toLowerCase()}</button>
      </div>`, async fd => {
      const v = variantById(String(fd.get("variant_id")));
      if (!v) throw new Error("Elige una talla.");
      const qty = Math.max(1, Number(fd.get("qty")) || 0);
      const free = freeOf(v);
      if (kind !== "restock" && qty > free) {
        throw new Error(`Solo quedan ${free} libres${v.label ? " de la talla " + v.label : ""}.`);
      }
      const { error } = await supa.from("merch_movements").insert({
        variant_id: v.id,
        kind,
        qty,
        unit_price: Number(fd.get("unit_price")) || 0,
        customer: String(fd.get("customer") || "").trim(),
        event: String(fd.get("event") || "").trim(),
        note: String(fd.get("note") || "").trim(),
        status: kind === "reserve" ? "open" : "done"
      });
      if (error) throw error;
      // La reserva no toca el stock: las unidades siguen en la caja hasta
      // que se entregan. Lo demás sí lo mueve.
      const delta = kind === "restock" ? qty : kind === "reserve" ? 0 : -qty;
      if (delta) await setStock(v.id, v.stock + delta);
    });

    // El tope de unidades y el precio dependen de la talla elegida.
    const sel = form.querySelector("[name=variant_id]");
    const qtyEl = form.querySelector("[name=qty]");
    const priceEl = form.querySelector("[name=unit_price]");
    const freeEl = form.querySelector("#mv-free");
    const sync = () => {
      const v = variantById(sel.value) || first;
      const free = freeOf(v);
      freeEl.textContent = (v.label ? " · " + v.label : "") + ` — ${free} libres de ${v.stock} en caja`;
      if (kind === "restock") qtyEl.removeAttribute("max"); else qtyEl.max = free;
      if (priceEl && pricey) priceEl.value = priceOf(v);
    };
    sync();
    sel.addEventListener("change", sync);
  }

  /* La caja se cuenta entera, talla por talla, no de una en una. */
  function countModal(p) {
    const vs = sizesOf(p);
    openModal(`
      <h2>Recuento</h2>
      <p class="lead">${esc(p.name)} — cuenta la caja y escribe lo que hay de verdad.</p>
      ${vs.map(v => `<label class="field">
        <span>${v.label ? esc(v.label) : "unidades"} <i>(la app dice ${v.stock})</i></span>
        <input name="q_${v.id}" type="number" min="0" value="${v.stock}" required></label>`).join("")}
      <label class="field"><span>nota</span><input name="note" placeholder="tras el bolo de marzo"></label>
      <div class="modal-acts">
        <button type="button" class="btn-ghost" data-cancel>cancelar</button>
        <button type="submit" class="btn-primary">cuadrar</button>
      </div>`, async fd => {
      const note = String(fd.get("note") || "").trim();
      for (const v of vs) {
        const counted = Math.max(0, Number(fd.get("q_" + v.id)) || 0);
        if (counted === v.stock) continue;
        const { error } = await supa.from("merch_movements").insert({
          variant_id: v.id, kind: "adjust", qty: counted, unit_price: 0,
          note: note || `antes ${v.stock}`
        });
        if (error) throw error;
        await setStock(v.id, counted);
      }
    });
  }

  async function setStock(variantId, stock) {
    const { error } = await supa.from("merch_variants")
      .update({ stock: Math.max(0, stock) }).eq("id", variantId);
    if (error) throw error;
  }

  /* Menú de lo que se usa poco: editar, regalar, cuadrar, archivar, borrar. */
  function openMoreMenu(anchor, p) {
    const pop = document.createElement("div");
    pop.className = "pop";
    pop.innerHTML = `<div class="pop-menu">
      <button data-more="edit">Editar producto y tallas</button>
      <button data-more="gift">Regalar unidades</button>
      <button data-more="count">Recuento de inventario</button>
      <hr>
      <button data-more="archive">${p.archived ? "Desarchivar" : "Archivar"}</button>
      <button data-more="delete" class="danger">Borrar producto e historial</button>
    </div>`;
    document.body.appendChild(pop);

    // Anclado al botón, subiéndolo si no cabe por debajo.
    const menu = pop.firstElementChild;
    const r = anchor.getBoundingClientRect();
    const h = menu.offsetHeight, w = menu.offsetWidth;
    menu.style.top = (r.bottom + 6 + h > innerHeight ? r.top - h - 6 : r.bottom + 6) + "px";
    menu.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + "px";

    const close = () => pop.remove();
    pop.addEventListener("click", async e => {
      const b = e.target.closest("button[data-more]");
      if (!b) { close(); return; }
      close();
      const what = b.dataset.more;
      if (what === "edit") return productModal(p);
      if (what === "gift") return movementModal(p, "gift");
      if (what === "count") return countModal(p);
      if (what === "archive") {
        const { error } = await supa.from("merch_products").update({ archived: !p.archived }).eq("id", p.id);
        if (error) alert(error.message); else load();
        return;
      }
      if (what === "delete") {
        if (!confirm(`Borrar «${p.name}», sus tallas y todos sus movimientos. No hay vuelta atrás.`)) return;
        const { error } = await supa.from("merch_products").delete().eq("id", p.id);
        if (error) alert(error.message); else load();
      }
    });
    document.addEventListener("keydown", function onEsc(e) {
      if (e.key !== "Escape") return;
      document.removeEventListener("keydown", onEsc);
      close();
    });
  }

  /* ---------------- acciones ---------------- */
  async function movAction(btn) {
    const m = movements.find(x => x.id === btn.dataset.id);
    if (!m) return;
    const action = btn.dataset.mov;

    if (action === "deliver") {
      const v = variantById(m.variant_id);
      if (!v) return alert("Esa talla ya no existe.");
      // Entregar una reserva = cerrarla y anotar la venta que la sustituye.
      const { error: e1 } = await supa.from("merch_movements")
        .update({ status: "done" }).eq("id", m.id);
      if (e1) return alert(e1.message);
      const { error: e2 } = await supa.from("merch_movements").insert({
        variant_id: m.variant_id, kind: "sale", qty: m.qty, unit_price: m.unit_price,
        customer: m.customer, event: m.event, note: "reserva entregada"
      });
      if (e2) return alert(e2.message);
      try { await setStock(v.id, v.stock - m.qty); } catch (err) { alert(err.message); }
      return load();
    }
    if (action === "cancel") {
      if (!confirm("Anular esta reserva. Las unidades vuelven a quedar libres.")) return;
      const { error } = await supa.from("merch_movements").update({ status: "cancelled" }).eq("id", m.id);
      if (error) alert(error.message); else load();
      return;
    }
    if (action === "delete") {
      if (!confirm("Borrar este apunte. Ojo: el stock NO se recalcula solo, haz un recuento después si hace falta.")) return;
      const { error } = await supa.from("merch_movements").delete().eq("id", m.id);
      if (error) alert(error.message); else load();
    }
  }

  $("prods").addEventListener("click", async e => {
    const mov = e.target.closest("button[data-mov]");
    if (mov) return movAction(mov);

    // Botón de una talla concreta del panel desplegado.
    const vbtn = e.target.closest("button[data-vact]");
    if (vbtn) {
      const v = variantById(vbtn.dataset.id);
      const p = v && productById(v.product_id);
      if (p) movementModal(p, vbtn.dataset.vact, v);
      return;
    }

    const btn = e.target.closest("button[data-act]");
    if (btn) {
      const p = productById(btn.dataset.id);
      if (!p) return;
      if (btn.dataset.act === "more") openMoreMenu(btn, p);
      else movementModal(p, btn.dataset.act);
      return;
    }

    // Cualquier otro sitio de la tarjeta abre o cierra su panel.
    if (e.target.closest(".prod-acts")) return;
    const card = e.target.closest(".prod[data-prod]");
    if (!card) return;
    openProduct = openProduct === card.dataset.prod ? null : card.dataset.prod;
    renderProducts();
  });

  $("movs").addEventListener("click", e => {
    const btn = e.target.closest("button[data-mov]");
    if (btn) movAction(btn);
  });

  $("new-product").addEventListener("click", () => productModal(null));
  $("q").addEventListener("input", renderProducts);
  $("show-archived").addEventListener("change", renderProducts);
  $("filter-kind").addEventListener("change", renderMovements);
  $("filter-status").addEventListener("change", renderMovements);

  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
    tab = t.dataset.tab;
    document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
    $("view-products").hidden = tab !== "products";
    $("view-movements").hidden = tab !== "movements";
    render();
  }));

  /* ---------------- arranque ---------------- */
  (async function () {
    await BestaSuite.guard();
    document.body.classList.add("ready");
    BestaSuite.mountNav({ active: "merch" });
    supa = await BestaSuite.client();
    await load();
  })();
})();
</script>
</body>
</html>
