<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
<meta name="theme-color" content="#050508" />
<title>BESTA — finanzas</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/suite/suite-shell.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="/suite/suite.js"></script>
<style>
  body { visibility: hidden; }
  body.ready { visibility: visible; }

  .finance-shell {
    max-width: 1100px; margin: 0 auto; padding: 28px 20px 90px;
  }

  .finance-hero {
    display: flex; align-items: end; justify-content: space-between; gap: 16px;
    margin-bottom: 28px; flex-wrap: wrap;
  }
  .eyebrow {
    margin: 0 0 8px; font-family: var(--mono); font-size: 10px;
    letter-spacing: .18em; text-transform: uppercase; color: var(--muted);
  }
  .finance-hero h1 {
    margin: 0; font-size: clamp(30px, 5vw, 42px); letter-spacing: -.04em;
  }

  .stats {
    display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    margin-bottom: 24px;
  }
  .stat {
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 15px;
    padding: 16px 18px; min-height: 110px;
  }
  .stat .k {
    font-family: var(--mono); font-size: 10px; letter-spacing: .15em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px;
  }
  .stat .v {
    font-size: clamp(24px, 4vw, 32px); font-weight: 700; letter-spacing: -.04em;
    font-variant-numeric: tabular-nums; line-height: 1.1;
  }
  .stat .v small { font-size: 14px; color: var(--muted); margin-left: 3px; }
  .stat.accent .v { color: var(--accent); }
  .stat.ok .v { color: var(--ok); }
  .stat.warn .v { color: var(--warn); }
  .stat.bad .v { color: var(--bad); }

  .board {
    display: grid; grid-template-columns: 1.1fr .9fr; gap: 18px; margin-bottom: 18px;
  }

  .panel {
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 16px;
    padding: 18px 18px 14px; min-width: 0;
  }
  .panel.full { margin-top: 0; }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-bottom: 16px; flex-wrap: wrap;
  }
  .panel-head span {
    display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 5px;
  }
  .panel-head h2 {
    margin: 0; font-size: 20px; letter-spacing: -.02em;
  }

  .balance-list,
  .expense-list,
  .member-grid {
    display: grid; gap: 10px;
  }

  .balance-item {
    display: grid; grid-template-columns: 1fr auto auto; gap: 12px;
    align-items: center; padding: 12px 12px; border: 1px solid var(--line);
    border-radius: 12px; background: rgba(255,255,255,0.015);
  }
  .person strong {
    display: block; font-size: 16px; margin-bottom: 2px;
  }
  .person span {
    display: block; font-size: 12px; color: var(--muted);
  }
  .balance-amount {
    font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .balance-amount.positive { color: var(--ok); }
  .balance-amount.negative { color: var(--bad); }
  .balance-tag {
    justify-self: end; padding: 5px 9px; border-radius: 999px; font-family: var(--mono);
    font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
    border: 1px solid var(--line);
  }
  .balance-tag.positive {
    background: rgba(95,214,165,.12); color: var(--ok); border-color: rgba(95,214,165,.32);
  }
  .balance-tag.negative {
    background: rgba(255,107,107,.12); color: var(--bad); border-color: rgba(255,107,107,.32);
  }

  .expense-item {
    display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center;
    padding: 12px 12px; border: 1px solid var(--line); border-radius: 12px;
    background: rgba(255,255,255,0.015);
  }
  .expense-item .meta {
    min-width: 0;
  }
  .expense-item .meta strong {
    display: block; font-size: 15px; margin-bottom: 3px;
  }
  .expense-item .meta span {
    display: block; font-size: 12px; color: var(--muted);
  }
  .expense-item .sum {
    text-align: right; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums;
  }
  .expense-item .sum small {
    display: block; font-size: 11px; font-weight: 500; color: var(--muted);
  }

  .member-grid {
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  }
  .member-card {
    background: rgba(255,255,255,0.02); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 14px 12px;
  }
  .member-card .top {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px;
  }
  .member-card .avatar {
    width: 34px; height: 34px; display: grid; place-items: center; border-radius: 12px;
    background: rgba(var(--accent-rgb), .14); color: var(--accent); font-weight: 700;
  }
  .member-card h3 {
    margin: 0; font-size: 16px;
  }
  .member-card .balance {
    font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .member-card .balance.good { color: var(--ok); }
  .member-card .balance.bad { color: var(--bad); }
  .member-card .rows {
    display: grid; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line);
  }
  .member-card .rows div {
    display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--muted);
  }
  .member-card .rows b {
    color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .member-card .remove-member {
    width: auto; padding: 6px 9px; border-radius: 8px; font-size: 11px;
  }

  .modal {
    position: fixed; inset: 0; background: rgba(5,5,8,0.7); backdrop-filter: blur(3px);
    display: none; place-items: center; padding: 18px; z-index: 40;
  }
  .modal.open { display: grid; }
  .modal-card {
    width: min(560px, 100%); background: var(--bg-2); border: 1px solid var(--line);
    border-radius: 18px; padding: 20px; box-shadow: 0 18px 50px rgba(0,0,0,0.45);
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px;
  }
  .modal-head h3 { margin: 0; font-size: 22px; }
  .close-btn { width: auto; min-width: 38px; padding: 8px 10px; border-radius: 8px; }
  .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
  .field-full { grid-column: 1 / -1; }
  .participant-list {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px;
    margin-top: 8px;
  }
  .check-pill {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px;
    border: 1px solid var(--line); background: rgba(255,255,255,0.02); color: var(--muted);
  }
  .check-pill input { width: auto; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .modal-actions button { width: auto; }
  .expense-item .actions {
    display: flex; gap: 6px; align-items: center; justify-content: flex-end; margin-left: 8px;
  }
  .expense-item .actions button {
    width: auto; padding: 6px 9px; border-radius: 8px; font-size: 11px;
  }
  .muted-empty {
    padding: 18px 10px; border: 1px dashed var(--line); border-radius: 12px;
    color: var(--muted); text-align: center; font-size: 13px;
  }

  .audit-list {
    display: grid; gap: 9px;
  }
  .audit-item {
    display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
    padding: 11px 12px; border: 1px solid var(--line); border-radius: 11px;
    background: rgba(255,255,255,0.015);
  }
  .audit-tag {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 92px; padding: 4px 8px; border-radius: 999px;
    font-family: var(--mono); font-size: 9px; letter-spacing: .11em; text-transform: uppercase;
  }
  .audit-tag.create { background: rgba(95,214,165,.12); color: var(--ok); border: 1px solid rgba(95,214,165,.3); }
  .audit-tag.delete { background: rgba(255,107,107,.12); color: var(--bad); border: 1px solid rgba(255,107,107,.3); }
  .audit-tag.system { background: rgba(255,255,255,.05); color: var(--muted); border: 1px solid var(--line); }
  .audit-copy strong { display: block; font-size: 14px; margin-bottom: 3px; }
  .audit-copy span { color: var(--muted); font-size: 12px; }
  .audit-date { font-family: var(--mono); font-size: 10px; color: var(--muted); }

  @media (max-width: 820px) {
    .board { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .audit-item { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="space-head">
  <div class="who">
    <img src="/assets/images/besta_color.png" alt="BESTA">
    <b>finanzas</b><i>suite</i>
  </div>
  <div class="tools">
    <a class="btn-ghost sm" href="/suite/" style="text-decoration:none">suite</a>
  </div>
</header>

<main class="finance-shell">
  <section class="finance-hero">
    <div>
      <p class="eyebrow">tricount de la banda</p>
      <h1>finanzas</h1>
    </div>
    <button class="btn-primary" type="button" style="max-width: 180px; width: 100%;">+ nuevo gasto</button>
  </section>

  <section class="stats">
    <article class="stat accent">
      <div class="k">gasto total</div>
      <div class="v"><span data-total>0</span><small>€</small></div>
    </article>
    <article class="stat ok">
      <div class="k">cobrado</div>
      <div class="v"><span data-paid>0</span><small>€</small></div>
    </article>
    <article class="stat warn">
      <div class="k">por repartir</div>
      <div class="v"><span data-share>0</span><small>€</small></div>
    </article>
    <article class="stat bad">
      <div class="k">saldo neto</div>
      <div class="v"><span data-net>0</span><small>€</small></div>
    </article>
  </section>

  <section class="board">
    <article class="panel">
      <div class="panel-head">
        <div>
          <span>equilibrio</span>
          <h2>balance por persona</h2>
        </div>
        <button class="btn-ghost sm" type="button">repartir</button>
      </div>
      <div id="balanceList" class="balance-list"></div>
    </article>

    <aside class="panel">
      <div class="panel-head">
        <div>
          <span>gastos</span>
          <h2>recientes</h2>
        </div>
      </div>
      <div id="expenseList" class="expense-list"></div>
    </aside>
  </section>

  <section class="panel full">
    <div class="panel-head">
      <div>
        <span>cuentas</span>
        <h2>desglose por miembro</h2>
      </div>
      <div style="display:flex; gap:8px; align-items:center;">
        <button class="btn-ghost sm" type="button">exportar</button>
        <button id="addMemberBtn" class="btn-primary" type="button" style="max-width: 160px; width: auto; padding: 8px 12px;">+ miembro</button>
      </div>
    </div>
    <div id="memberGrid" class="member-grid"></div>
  </section>

  <section class="panel full" style="margin-top: 18px;">
    <div class="panel-head">
      <div>
        <span>trazabilidad</span>
        <h2>logs y auditoría</h2>
      </div>
    </div>
    <div id="auditList" class="audit-list"></div>
  </section>
</main>

<div id="expenseModal" class="modal" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="expenseTitle">
    <div class="modal-head">
      <h3 id="expenseTitle">Nuevo gasto</h3>
      <button class="btn-ghost sm close-btn" type="button" data-close-modal>×</button>
    </div>

    <form id="expenseForm">
      <div class="form-grid">
        <label class="field field-full">
          <span>concepto</span>
          <input name="title" type="text" placeholder="Ej. Furgo / local / comida" required />
        </label>

        <label class="field">
          <span>cantidad</span>
          <input name="amount" type="number" min="1" step="0.01" placeholder="0,00" required />
        </label>

        <label class="field">
          <span>pagado por</span>
          <select name="payer"></select>
        </label>

        <label class="field">
          <span>categoría</span>
          <select name="category">
            <option value="traslado">traslado</option>
            <option value="local">local</option>
            <option value="instrumentos">instrumentos</option>
            <option value="material">material</option>
            <option value="comida">comida</option>
            <option value="directo">directo</option>
            <option value="otros">otros</option>
          </select>
        </label>

        <div class="field field-full">
          <span>participantes</span>
          <div id="participantList" class="participant-list"></div>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-ghost sm" type="button" data-close-modal>cancelar</button>
        <button class="btn-primary" type="submit" style="max-width: 160px;">guardar gasto</button>
      </div>
    </form>
  </div>
</div>

<div id="memberModal" class="modal" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="memberTitle">
    <div class="modal-head">
      <h3 id="memberTitle">Nuevo miembro</h3>
      <button class="btn-ghost sm close-btn" type="button" data-close-member>×</button>
    </div>

    <form id="memberForm">
      <div class="form-grid">
        <label class="field field-full">
          <span>nombre</span>
          <input name="memberName" type="text" placeholder="Ej. Alex" required />
        </label>
      </div>

      <div class="modal-actions">
        <button class="btn-ghost sm" type="button" data-close-member>cancelar</button>
        <button class="btn-primary" type="submit" style="max-width: 160px;">guardar miembro</button>
      </div>
    </form>
  </div>
</div>

<script>
(async function () {
  await BestaSuite.guard();
  document.body.classList.add("ready");
  BestaSuite.mountNav({ active: "finanzas" });

  const STORAGE_KEY = "besta_finanzas_state_v1";
  const DEFAULT_MEMBERS = [
    { name: "Pilar", initials: "P" },
    { name: "Adri", initials: "A" },
    { name: "Mikel", initials: "M" },
    { name: "Leo", initials: "L" }
  ];

  const DEFAULT_EXPENSES = [
    { id: 1, title: "Furgo + aparcamiento", amount: 146, payer: "Pilar", date: "2026-08-24", category: "traslado", participants: ["Pilar", "Adri", "Mikel", "Leo"] },
    { id: 2, title: "Cuerdas y afinación", amount: 82, payer: "Adri", date: "2026-08-22", category: "instrumentos", participants: ["Pilar", "Adri", "Mikel", "Leo"] },
    { id: 3, title: "Local ensayo", amount: 210, payer: "Mikel", date: "2026-08-18", category: "local", participants: ["Pilar", "Adri", "Mikel", "Leo"] },
    { id: 4, title: "Póster y flyers", amount: 64, payer: "Leo", date: "2026-08-14", category: "material", participants: ["Pilar", "Adri", "Mikel", "Leo"] },
    { id: 5, title: "Comida de reunión", amount: 48, payer: "Pilar", date: "2026-08-10", category: "comida", participants: ["Pilar", "Adri", "Mikel"] },
    { id: 6, title: "Compra de agua + hielo", amount: 26, payer: "Leo", date: "2026-08-08", category: "directo", participants: ["Pilar", "Mikel", "Leo"] }
  ];

  const DEFAULT_LOGS = [
    { id: "seed-1", type: "system", actor: "sistema", createdAt: "2026-08-08T12:00:00.000Z", message: "Cargada la trazabilidad inicial de la banda." },
    { id: "seed-2", type: "system", actor: "sistema", createdAt: "2026-08-24T12:00:00.000Z", message: "Sincronizado el primer bloque de gastos del mes." }
  ];

  const money = (n) => new Intl.NumberFormat("es-ES", { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(n);
  const formatDate = (value) => new Date(value + "T12:00:00").toLocaleDateString("es-ES", { day: "2-digit", month: "short" });
  const formatLogDate = (value) => new Date(value).toLocaleString("es-ES", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });

  function getState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { members: DEFAULT_MEMBERS, expenses: DEFAULT_EXPENSES, logs: DEFAULT_LOGS };
      const parsed = JSON.parse(raw);
      return {
        members: Array.isArray(parsed.members) && parsed.members.length ? parsed.members : DEFAULT_MEMBERS,
        expenses: Array.isArray(parsed.expenses) ? parsed.expenses : DEFAULT_EXPENSES,
        logs: Array.isArray(parsed.logs) && parsed.logs.length ? parsed.logs : DEFAULT_LOGS
      };
    } catch (_) {
      return { members: DEFAULT_MEMBERS, expenses: DEFAULT_EXPENSES, logs: DEFAULT_LOGS };
    }
  }

  function saveState(state) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function recordLog(state, type, message, actor = "usuario") {
    const entry = {
      id: `${Date.now()}-${Math.random().toString(16).slice(2, 8)}`,
      type,
      actor,
      createdAt: new Date().toISOString(),
      message
    };
    state.logs = [entry, ...(state.logs || [])].slice(0, 20);
    saveState(state);
  }

  function getExpenseSummary(state) {
    const summary = state.members.map(member => ({
      ...member,
      paid: 0,
      share: 0,
      balance: 0
    }));

    state.expenses.forEach(expense => {
      const participants = expense.participants.length || 1;
      const share = expense.amount / participants;

      summary.forEach(member => {
        if (expense.participants.includes(member.name)) member.share += share;
        if (member.name === expense.payer) member.paid += expense.amount;
      });
    });

    summary.forEach(member => {
      member.balance = member.paid - member.share;
    });

    return summary;
  }

  function renderStats(state) {
    const total = state.expenses.reduce((sum, item) => sum + Number(item.amount || 0), 0);
    const summary = getExpenseSummary(state);
    const paid = summary.reduce((sum, member) => sum + Number(member.paid || 0), 0);
    const share = summary.reduce((sum, member) => sum + Number(member.share || 0), 0);
    const net = total - paid;

    const totalEl = document.querySelector('[data-total]');
    const paidEl = document.querySelector('[data-paid]');
    const shareEl = document.querySelector('[data-share]');
    const netEl = document.querySelector('[data-net]');

    totalEl.textContent = money(total);
    paidEl.textContent = money(paid);
    shareEl.textContent = money(share);
    netEl.textContent = money(net);
  }

  function renderBalance(state) {
    const list = document.getElementById("balanceList");
    const summary = getExpenseSummary(state).sort((a, b) => b.balance - a.balance);

    list.innerHTML = summary.map(member => {
      const isPositive = member.balance > 0;
      return `
        <div class="balance-item">
          <div class="person">
            <strong>${member.name}</strong>
            <span>${member.paid > 0 ? "ha pagado" : "sin pagos"}</span>
          </div>
          <div class="balance-amount ${isPositive ? "positive" : "negative"}">
            ${isPositive ? "+" : "-"}${money(Math.abs(member.balance))}€
          </div>
          <div class="balance-tag ${isPositive ? "positive" : "negative"}">${isPositive ? "cobra" : "debe"}</div>
        </div>
      `;
    }).join("");
  }

  function renderExpenses(state) {
    const list = document.getElementById("expenseList");
    const sorted = [...state.expenses].sort((a, b) => new Date(b.date) - new Date(a.date));

    if (!sorted.length) {
      list.innerHTML = '<div class="muted-empty">Todavía no hay gastos. Añade el primero.</div>';
      return;
    }

    list.innerHTML = sorted.slice(0, 5).map(item => `
      <div class="expense-item">
        <div class="meta">
          <strong>${item.title}</strong>
          <span>${item.category} · ${item.payer} · ${formatDate(item.date)}</span>
        </div>
        <div class="actions">
          <div class="sum">${money(item.amount)}€<small>${item.participants.length} personas</small></div>
          <button class="btn-ghost sm delete-expense" type="button" data-id="${item.id}">borrar</button>
        </div>
      </div>
    `).join("");
  }

  function renderMembers(state) {
    const grid = document.getElementById("memberGrid");
    const summary = getExpenseSummary(state);

    grid.innerHTML = summary.map(member => {
      const isPositive = member.balance > 0;
      return `
        <div class="member-card">
          <div class="top">
            <div class="avatar">${member.initials}</div>
            <div class="balance ${isPositive ? "good" : "bad"}">${isPositive ? "+" : "-"}${money(Math.abs(member.balance))}€</div>
          </div>
          <h3>${member.name}</h3>
          <div class="rows">
            <div><span>pagado</span><b>${money(member.paid)}€</b></div>
            <div><span>parte</span><b>${money(member.share)}€</b></div>
            <div><span>estado</span><b>${isPositive ? "cobra" : "debe"}</b></div>
          </div>
          <div style="margin-top:12px; display:flex; justify-content:flex-end;">
            <button class="btn-ghost sm remove-member" type="button" data-member-name="${member.name}">eliminar</button>
          </div>
        </div>
      `;
    }).join("");
  }

  function renderAudit(state) {
    const list = document.getElementById("auditList");
    const entries = (state.logs || []).slice(0, 12);

    if (!entries.length) {
      list.innerHTML = '<div class="muted-empty">No hay trazabilidad todavía.</div>';
      return;
    }

    list.innerHTML = entries.map(entry => `
      <div class="audit-item">
        <div class="audit-tag ${entry.type === "delete" ? "delete" : entry.type === "create" ? "create" : "system"}">${entry.type === "delete" ? "baja" : entry.type === "create" ? "alta" : "sistema"}</div>
        <div class="audit-copy">
          <strong>${entry.message}</strong>
          <span>${entry.actor}</span>
        </div>
        <div class="audit-date">${formatLogDate(entry.createdAt)}</div>
      </div>
    `).join("");
  }

  function renderAll() {
    const state = getState();
    renderStats(state);
    renderBalance(state);
    renderExpenses(state);
    renderMembers(state);
    renderAudit(state);
  }

  function populateFormSelects(state) {
    const payerSelect = document.querySelector('[name="payer"]');
    payerSelect.innerHTML = state.members.map(member => `<option value="${member.name}">${member.name}</option>`).join("");
    payerSelect.value = state.members[0].name;

    const list = document.getElementById("participantList");
    list.innerHTML = state.members.map(member => `
      <label class="check-pill">
        <input type="checkbox" value="${member.name}" checked />
        <span>${member.name}</span>
      </label>
    `).join("");
  }

  function openModal() {
    const modal = document.getElementById("expenseModal");
    modal.classList.add("open");
    modal.setAttribute("aria-hidden", "false");
  }

  function closeModal() {
    const modal = document.getElementById("expenseModal");
    modal.classList.remove("open");
    modal.setAttribute("aria-hidden", "true");
    document.getElementById("expenseForm").reset();
    populateFormSelects(getState());
  }

  function openMemberModal() {
    const modal = document.getElementById("memberModal");
    modal.classList.add("open");
    modal.setAttribute("aria-hidden", "false");
  }

  function closeMemberModal() {
    const modal = document.getElementById("memberModal");
    modal.classList.remove("open");
    modal.setAttribute("aria-hidden", "true");
    document.getElementById("memberForm").reset();
  }

  function normalizeMemberName(value) {
    return String(value || "").trim().replace(/\s+/g, " ");
  }

  function addMember(event) {
    event.preventDefault();
    const state = getState();
    const form = event.currentTarget;
    const name = normalizeMemberName(new FormData(form).get("memberName"));

    if (!name) return;
    const exists = state.members.some(member => member.name.toLowerCase() === name.toLowerCase());
    if (exists) {
      window.alert("Ese miembro ya existe.");
      return;
    }

    const initials = name.split(" ").filter(Boolean).slice(0, 2).map(part => part[0].toUpperCase()).join("") || name.slice(0, 2).toUpperCase();
    state.members.push({ name, initials });
    recordLog(state, "create", `Miembro añadido: ${name}.`, "usuario");
    saveState(state);
    closeMemberModal();
    renderAll();
    populateFormSelects(getState());
  }

  function removeMember(name) {
    const state = getState();
    const member = state.members.find(item => item.name.toLowerCase() === String(name).toLowerCase());
    if (!member) return;
    if (state.members.length <= 1) {
      window.alert("Debes dejar al menos un miembro en la cuenta.");
      return;
    }

    const confirmed = window.confirm(`¿Seguro que quieres eliminar a ${member.name} y quitarlo de todos los gastos?`);
    if (!confirmed) return;

    state.members = state.members.filter(item => item.name.toLowerCase() !== String(name).toLowerCase());
    state.expenses = state.expenses.map(expense => ({
      ...expense,
      payer: expense.payer && expense.payer.toLowerCase() === String(name).toLowerCase() ? state.members[0]?.name || "" : expense.payer,
      participants: (expense.participants || []).filter(participant => participant.toLowerCase() !== String(name).toLowerCase())
    })).filter(expense => expense.participants.length > 0);

    recordLog(state, "delete", `Miembro eliminado: ${member.name}.`, "usuario");
    saveState(state);
    renderAll();
    populateFormSelects(getState());
  }

  function addExpense(event) {
    event.preventDefault();
    const state = getState();
    const form = event.currentTarget;
    const data = new FormData(form);
    const title = String(data.get("title") || "").trim();
    const amount = Number(data.get("amount"));
    const payer = String(data.get("payer") || "");
    const category = String(data.get("category") || "otros");
    const selectedParticipants = [...document.querySelectorAll('#participantList input:checked')].map(input => input.value);

    if (!title || !Number.isFinite(amount) || amount <= 0 || selectedParticipants.length === 0) {
      return;
    }

    const nextId = state.expenses.reduce((max, item) => Math.max(max, Number(item.id) || 0), 0) + 1;
    state.expenses.unshift({
      id: nextId,
      title,
      amount,
      payer,
      date: new Date().toISOString().slice(0, 10),
      category,
      participants: selectedParticipants
    });

    recordLog(state, "create", `Gasto añadido: ${title} (${money(amount)}€) pagado por ${payer}.`, "usuario");
    saveState(state);
    closeModal();
    renderAll();
  }

  function deleteExpense(id) {
    const state = getState();
    const item = state.expenses.find(entry => String(entry.id) === String(id));
    if (!item) return;

    if (!window.confirm(`¿Seguro que quieres borrar el gasto "${item.title}" por ${money(item.amount)}€?`)) {
      return;
    }

    state.expenses = state.expenses.filter(entry => String(entry.id) !== String(id));
    recordLog(state, "delete", `Gasto eliminado: ${item.title} (${money(item.amount)}€) por ${item.payer}.`, "usuario");
    saveState(state);
    renderAll();
  }

  document.querySelector(".finance-hero .btn-primary").addEventListener("click", openModal);
  document.getElementById("addMemberBtn").addEventListener("click", openMemberModal);
  document.querySelectorAll("[data-close-modal]").forEach(button => button.addEventListener("click", closeModal));
  document.querySelectorAll("[data-close-member]").forEach(button => button.addEventListener("click", closeMemberModal));
  document.getElementById("expenseForm").addEventListener("submit", addExpense);
  document.getElementById("memberForm").addEventListener("submit", addMember);

  document.addEventListener("click", (event) => {
    const deleteButton = event.target.closest(".delete-expense");
    if (deleteButton) {
      const { id } = deleteButton.dataset;
      if (id) deleteExpense(id);
      return;
    }

    const removeButton = event.target.closest(".remove-member");
    if (removeButton) {
      const { memberName } = removeButton.dataset;
      if (memberName) removeMember(memberName);
    }
  });

  const initialState = getState();
  populateFormSelects(initialState);
  renderAll();
})();
</script>
</body>
</html>
