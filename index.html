<style>
:root {
  --bg: #050508;
  --fg: #f5f7ff;
  --accent: #db7f4e; /* cambia acento si quieres */
  --accent-rgb: 219, 127, 78;
  --glow: 0 0 18px rgba(var(--accent-rgb), 0.35);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: 'Space Grotesk', system-ui, sans-serif;
  overflow: hidden; height: 100vh; display: grid; place-items: center;
}
main { position: relative; width: 100%; height: 100%; display: grid; place-items: center; }
.hero {
  text-align: center; z-index: 3; padding: clamp(16px, 3vw, 32px);
  display: grid; gap: clamp(12px, 2vw, 22px); place-items: center;
}
.brand-logo {
  display: block;
  width: min(56vw, 360px);
  max-width: 100%;
  height: auto;
  opacity: 0.9;
  filter: drop-shadow(0 0 18px rgba(var(--accent-rgb), 0.2));
}
/* Contador */
.count {
  font-family: 'Major Mono Display', monospace;
  font-size: clamp(42px, 8vw, 96px);
  letter-spacing: 0.06em;
  padding: clamp(10px, 2vw, 16px) clamp(18px, 3vw, 28px);
  max-width: min(96vw, 1100px);
  background: #0d0b11;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  box-shadow:
    inset 0 0 30px rgba(255,255,255,0.04),
    0 0 38px rgba(var(--accent-rgb), 0.18),
    0 0 12px rgba(84, 147, 255, 0.24);
  position: relative;
  overflow: hidden;
}
.count.tick {
  animation: tick 0.35s ease;
}
@keyframes tick {
  0% { transform: translateY(-6px) scale(0.98); opacity: 0.7; }
  60% { transform: translateY(1px) scale(1.01); opacity: 1; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}
.count::after { /* scanline sweep */
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,0.06) 50%,
    rgba(255,255,255,0) 100%);
  mix-blend-mode: screen;
  animation: sweep 3.6s ease-in-out infinite;
}
@keyframes sweep {
  0% { transform: translateY(-100%); }
  50% { transform: translateY(0); }
  100% { transform: translateY(100%); }
}
.tagline {
  font-size: clamp(14px, 2.2vw, 18px);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(245,247,255,0.82);
}
.footer {
  position: absolute; bottom: clamp(12px, 3vw, 28px); left: 0; right: 0;
  display: flex; justify-content: center; gap: 14px; z-index: 3;
  flex-wrap: wrap;
  padding: 0 12px;
}
.footer a {
  color: var(--fg); text-decoration: none; font-size: 13px; letter-spacing: 0.14em;
  padding: 8px 14px; border: 1px solid rgba(255,255,255,0.12); border-radius: 999px;
  backdrop-filter: blur(6px); background: rgba(5,5,8,0.35);
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s;
}
.footer a:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: var(--glow); }

/* Canvas layers */
.canvas-stack {
  position: absolute; inset: 0; pointer-events: none; overflow: hidden;
  z-index: 1;
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* Grain overlay */
.grain {
  mix-blend-mode: soft-light; opacity: 0.28;
}

/* CRT vignette */
.vignette {
  position: absolute; inset: -10%; pointer-events: none; z-index: 2;
  background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.5) 80%, rgba(0,0,0,0.8) 100%);
  mix-blend-mode: multiply;
}

/* Video de fondo */
.video-bg {
  position: absolute; inset: 0; overflow: hidden; z-index: 0;
}
.video-bg video {
  width: 100%; height: 100%; object-fit: cover;
  filter: saturate(1.05) contrast(1.05) brightness(0.9);
  opacity: 0.6;
  transform: scale(1.02);
  transition: opacity 0.8s ease;
}
.video-overlay {
  position: absolute; inset: 0;
  background: radial-gradient(circle at center, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.5) 55%, rgba(0,0,0,0.65) 100%);
  mix-blend-mode: multiply;
  pointer-events: none;
  z-index: 1;
}

/* Subtle flicker on everything */
.flicker {
  animation: flicker 5s steps(2, end) infinite;
}
@keyframes flicker {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.97; }
}

/* Hover reactive glow */
main:hover .count { box-shadow: 0 0 48px rgba(var(--accent-rgb), 0.32), 0 0 18px rgba(84,147,255,0.32); }

/* Responsive center alignment ensured by grid */

@media (max-width: 520px) {
  body { padding: 0 10px; }
  .hero { gap: 12px; }
  .brand-logo {
    width: min(78vw, 280px);
  }
  .tagline {
    letter-spacing: 0.07em;
    font-size: 12.5px;
    max-width: 92vw;
    text-align: center;
  }
  .count {
    font-size: clamp(28px, 14vw, 52px);
    padding: 10px 12px;
    letter-spacing: 0.03em;
    max-width: 96vw;
  }
  .footer {
    gap: 8px;
    flex-wrap: wrap;
    padding: 0 10px 8px;
  }
  .footer a {
    font-size: 12px;
    padding: 8px 11px;
  }
}

<body>
<div class="canvas-stack">
  <canvas id="noise" class="grain"></canvas>
  <canvas id="glitch"></canvas>
</div>
<div class="vignette"></div>

<!-- Fondo de video: coloca tu MP4 optimizado en assets/videos/bg.mp4 y un poster en assets/bg.jpg -->
<div class="video-bg">
  <video id="bgvid" autoplay muted playsinline preload="metadata" poster="assets/bg.jpg"></video>
  <div class="video-overlay"></div>
</div>

<main>
  <section class="hero flicker">
    <img class="brand-logo" src="assets/images/besta_color.png" alt="BESTA">
    <div id="countdown" class="count">00:00:00:00</div>
  </section>
  <div class="footer">
    <a href="https://instagram.com/besta_oficial" target="_blank" rel="noreferrer">instagram</a>
    <a href="https://open.spotify.com/artist/0nlIm3zhG83MzO6IjuoJyN" target="_blank" rel="noreferrer">spotify</a>
  </div>
</main>

<script>
/* === Ajustes rápidos === */
const LAUNCH_DATE = new Date("2026-06-06T20:00:00+02:00"); // hora oficial CEST (España)
/* ======================= */

/* Fondo de vídeo: edita clips y rangos aquí */
const videoBg = document.getElementById("bgvid");
const clips = [
  { src: "assets/videos/guitarra.mp4", start: 0, end: 3.4 }, // ~3-4 s cada uno, total ~10 s
  { src: "assets/videos/micro.mp4",    start: 0, end: 3.3 },
  { src: "assets/videos/bateria.mp4",  start: 0, end: 3.3 }
];
let clipIndex = 0;

function playClip(i) {
  const clip = clips[i % clips.length];
  videoBg.style.opacity = 0.2; // fade-out breve
  videoBg.src = clip.src;
  videoBg.load();
  videoBg.onloadedmetadata = () => {
    videoBg.currentTime = clip.start;
    videoBg.play().catch(() => {/* autoplay fallback ignored */});
    requestAnimationFrame(() => videoBg.style.opacity = 0.55); // fade-in
  };
  videoBg.ontimeupdate = () => {
    if (videoBg.currentTime >= clip.end) {
      nextClip();
    }
  };
  videoBg.onended = () => nextClip();
}
function nextClip() {
  clipIndex = (clipIndex + 1) % clips.length;
  playClip(clipIndex);
}
playClip(0);

/* Countdown */
const countdownEl = document.getElementById("countdown");
function updateCountdown() {
  const now = new Date();
  const diff = LAUNCH_DATE - now;
  if (diff <= 0) { countdownEl.textContent = "00:00:00:00"; return; }
  const d = Math.floor(diff / (1000 * 60 * 60 * 24));
  const h = Math.floor(diff / (1000 * 60 * 60)) % 24;
  const m = Math.floor(diff / (1000 * 60)) % 60;
  const s = Math.floor(diff / 1000) % 60;
  countdownEl.textContent = `${String(d).padStart(2,"0")}:${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  countdownEl.classList.add('tick');
  setTimeout(() => countdownEl.classList.remove('tick'), 180);
}
setInterval(updateCountdown, 1000);
updateCountdown();

/* Noise layer */
const noiseCanvas = document.getElementById("noise");
const glitchCanvas = document.getElementById("glitch");
const nctx = noiseCanvas.getContext("2d");
const gctx = glitchCanvas.getContext("2d");
function resize() {
  [noiseCanvas, glitchCanvas].forEach(c => { c.width = window.innerWidth; c.height = window.innerHeight; });
}
window.addEventListener("resize", resize);
resize();

function drawNoise() {
  const w = noiseCanvas.width, h = noiseCanvas.height;
  const imageData = nctx.createImageData(w, h);
  for (let i = 0; i < imageData.data.length; i += 4) {
    const v = Math.random() * 255;
    imageData.data[i] = v;
    imageData.data[i+1] = v;
    imageData.data[i+2] = v;
    imageData.data[i+3] = Math.random() * 70; // alpha
  }
  nctx.putImageData(imageData, 0, 0);
}

let glitchTimer = 0;
function drawGlitch(t) {
  gctx.clearRect(0,0,glitchCanvas.width,glitchCanvas.height);
  if (t - glitchTimer > 900 + Math.random()*1500) {
    glitchTimer = t;
    const bars = 3 + Math.floor(Math.random()*3);
    for (let i=0;i<bars;i++) {
      const y = Math.random()*glitchCanvas.height;
      const h = 8 + Math.random()*28;
      gctx.fillStyle = `rgba(${120+Math.random()*80}, ${Math.random()*160}, ${255}, ${0.12+Math.random()*0.28})`;
      gctx.fillRect(-20, y, glitchCanvas.width+40, h);
      gctx.globalCompositeOperation = "screen";
      gctx.fillStyle = `rgba(219, 127, 78, ${0.08+Math.random()*0.2})`;
      gctx.fillRect(0, y + Math.random()*6 - 3, glitchCanvas.width, h/2);
      gctx.globalCompositeOperation = "source-over";
    }
    // horizontal shift
    const sliceH = 40 + Math.random()*120;
    const sliceY = Math.random()*(glitchCanvas.height - sliceH);
    const img = gctx.getImageData(0, sliceY, glitchCanvas.width, sliceH);
    const offset = (Math.random()*60 - 30);
    gctx.putImageData(img, offset, sliceY);
  }
  requestAnimationFrame(drawGlitch);
}

/* Mild flicker on countdown */
function pulse() {
  countdownEl.style.filter = `drop-shadow(0 0 ${6+Math.random()*10}px rgba(219, 127, 78, 0.45))`;
  countdownEl.style.opacity = 0.96 + Math.random()*0.04;
  requestAnimationFrame(pulse);
}

/* Mouse parallax for subtle movement */
document.addEventListener("pointermove", e => {
  const x = (e.clientX / window.innerWidth - 0.5) * 8;
  const y = (e.clientY / window.innerHeight - 0.5) * 6;
  document.querySelector(".hero").style.transform = `translate(${x}px, ${y}px)`;
});

/* Animate */
function loop() { drawNoise(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
requestAnimationFrame(drawGlitch);
requestAnimationFrame(pulse);
</script>
</body>
